# Configurazione del caricamento automatico dei log (vedi README.md): una per ogni bot installato.
# È un file di shell: NOME="valore", senza spazi attorno a "=".
# Non contiene credenziali: la chiave di deploy è un file a parte, creato da installa.sh.

# Nome breve dell'installazione (lettere minuscole, cifre e trattini): compare nella riga
# di crontab, nei nomi dei file e in STATO.md.
ISTANZA="cliente"

# Repository privato di soli log. La chiave di deploy creata da installa.sh deve avere scrittura.
REPO_LOG="git@github.com:ACCOUNT/NOME-log.git"

# Cartella dei log del bot, quella con le cartelle dei giorni (AAAA-MM-GG).
CARTELLA_LOG="/home/UTENTE/telegram-trade-agent/logs"

# Facoltativi: i valori indicati sono quelli usati se la riga resta commentata.
# CARTELLA_COPIA="$HOME/$ISTANZA-log"          # copia di lavoro del repository dei log
# CHIAVE="$HOME/.ssh/${ISTANZA}_log"           # chiave di deploy
# ORARIO_CRON="5 * * * *"                       # quando caricare (crontab): ogni ora, ai :05
# FUSO="Europe/Rome"                            # fuso orario dei log del bot e di STATO.md
# SERVIZIO_BOT="telegram-trade-agent.service"   # servizio systemd del bot ("" = non controllarlo)
# PROCESSO_BOT="telegram_listener.py"           # processo del bot, per pgrep -f ("" = non contarlo)
# SERVIZI_EXTRA=""                              # altri servizi systemd da controllare, separati da spazi
# RIGA_AVVIO="Bot avviato"                      # testo della riga di avvio nel bot.log
# RIGA_BATTITO="Bot attivo"                     # testo della riga del battito nel bot.log
# ORE_BATTITO=5                                 # dopo quante ore senza battito STATO.md dà l'avviso
# REGISTRO="$HOME/.local/state/caricamento-log/$ISTANZA.log"   # uscita dei caricamenti
